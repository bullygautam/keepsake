name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt
      - name: Install Python packages
        run: python -m pip install -r requirements-build.txt
      - name: Download cutout model during build
        shell: pwsh
        run: |
          python -c "from rembg import new_session; new_session('u2netp'); print('Cutout model ready')"
          if (!(Test-Path "$env:USERPROFILE/.u2net/u2netp.onnx")) { throw 'Model file missing' }
      - name: Build self-contained application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name KeepsakeStudio --collect-all rembg --collect-all onnxruntime --add-data "$env:USERPROFILE/.u2net/u2netp.onnx;models" keepsake.py
          if (!(Test-Path dist/KeepsakeStudio/KeepsakeStudio.exe)) { throw 'EXE missing' }
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc KeepsakeStudio.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: KeepsakeStudio-Windows-Installer
          path: installer/KeepsakeStudio_Setup_5_2.exe
          if-no-files-found: error
